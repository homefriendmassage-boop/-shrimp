<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมัครสมาชิกทั่วไป</title>
<script src="../config.js"></script><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>body{background:#101820;color:#eef4fb;font:16px system-ui,sans-serif;max-width:560px;margin:36px auto;padding:16px}.card{padding:24px;border:1px solid #34495b;background:#1a2634;border-radius:18px}button{background:#15805a;color:white;border:0;border-radius:9px;padding:14px 18px;font-weight:700;margin:8px 6px 0 0;cursor:pointer}button:disabled{opacity:.4}label{display:block;margin-top:16px}input{display:block;box-sizing:border-box;background:#101820;color:white;border:1px solid #789;width:100%;padding:13px;border-radius:9px}#result{line-height:1.7;white-space:pre-wrap;margin-top:14px}small{color:#bccddd}</style></head>
<body><div class="card"><h1>สมัครสมาชิกทั่วไป</h1><small>ใช้สำหรับลงทะเบียนและขออนุมัติสมาชิกทั่วไปเท่านั้น ไม่เกี่ยวกับการเดิมพันหรือการปรับเครดิต</small>
<label>รหัสร้าน<input id="shop" readonly></label>
<label>ชื่อแสดงในระบบ<input id="name" maxlength="80" placeholder="ชื่อสมาชิก"></label>
<button id="apply" disabled>ส่งคำขอสมัครสมาชิก</button><button id="check" disabled>ตรวจสถานะ</button>
<div id="result" role="status">กำลังเข้าสู่ระบบ LINE…</div></div>
<script>
const $=x=>document.getElementById(x);let logged=false;
$('shop').value=new URLSearchParams(location.search).get('shop')||'';
async function request(action){
 $('result').textContent='กำลังดำเนินการ…';$('apply').disabled=true;$('check').disabled=true;
 try{
  const body={action,shop_id:$('shop').value};if(action==='apply')body.display_name=$('name').value.trim();
  const r=await fetch(APP_CONFIG.SUPABASE_URL+'/functions/v1/member-approval',{
   method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+liff.getIDToken(),apikey:APP_CONFIG.SUPABASE_ANON_KEY},body:JSON.stringify(body)
  });
  const j=await r.json();if(!r.ok||!j.ok)throw Error(j.code||r.status);
  const state=j.application?.state||'NotApplied';
  const names={Pending:'รอแอดมินอนุมัติ',Approved:'อนุมัติสมาชิกทั่วไปแล้ว',Rejected:'ไม่ผ่านการอนุมัติ',NotApplied:'ยังไม่ได้สมัคร'};
  $('result').textContent=(names[state]||state)+(j.application?.id?'\nเลขคำขอ: '+j.application.id:'');
 }catch(e){$('result').textContent='ข้อผิดพลาด: '+e.message}
 finally{$('apply').disabled=!logged;$('check').disabled=!logged}
}
$('apply').onclick=()=>request('apply');$('check').onclick=()=>request('status');
(async()=>{try{
 if(!$('shop').value)throw Error('กรุณาเปิดผ่านลิงก์ที่มี shop ID');
 await liff.init({liffId:APP_CONFIG.LIFF_ID_PLAYER});
 if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
 if(!liff.getIDToken())throw Error('LIFF ต้องเปิด scope openid');
 const p=await liff.getProfile();$('name').value=p.displayName||'';
 logged=true;$('apply').disabled=false;$('check').disabled=false;request('status')
}catch(e){$('result').textContent='เปิดใช้งานไม่ได้: '+e.message}})();
</script></body></html>
