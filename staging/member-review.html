<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>อนุมัติสมาชิกทั่วไป</title>
<script src="../config.js"></script><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>body{background:#0c1421;color:#eef2ff;font:16px system-ui,sans-serif;max-width:840px;margin:30px auto;padding:16px}.card{background:#1d2a3c;border-radius:12px;padding:18px;margin:12px 0}button{background:#2368bf;color:white;border:0;padding:12px 15px;margin:6px 8px 0 0;border-radius:9px;cursor:pointer}button.danger{background:#933e43}button:disabled{opacity:.4}#message{white-space:pre-wrap}small{color:#bcc7d6}</style></head>
<body><h1>คำขอสมาชิกทั่วไป</h1><p>อนุมัติเฉพาะสถานะการสมัครสมาชิกทั่วไป ไม่เปิดสิทธิ์การเดิมพันหรือเติมเครดิต</p><button id="reload">โหลดคำขอ</button><div id="message" role="status"></div><div id="entries"></div>
<script>
const $=x=>document.getElementById(x), shop=new URLSearchParams(location.search).get('shop')||'';
async function call(body){
 const r=await fetch(APP_CONFIG.SUPABASE_URL+'/functions/v1/member-approval',{
  method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+liff.getIDToken(),apikey:APP_CONFIG.SUPABASE_ANON_KEY},
  body:JSON.stringify({...body,shop_id:shop})});
 const j=await r.json();if(!r.ok||!j.ok)throw Error(j.code||r.status);return j;
}
async function decide(id,decision){
 if(!confirm('ยืนยัน '+(decision==='Approved'?'อนุมัติ':'ปฏิเสธ')+' คำขอนี้?'))return;
 try{await call({action:'decide',id,decision});await load()}catch(e){$('message').textContent=e.message}
}
async function load(){
 $('message').textContent='กำลังโหลด…';$('entries').replaceChildren();
 try{const j=await call({action:'queue'});$('message').textContent='พบ '+j.entries.length+' คำขอ';
  for(const e of j.entries){
   const card=document.createElement('section');card.className='card';
   const title=document.createElement('h3');title.textContent=(e.display_name||'ไม่ระบุชื่อ')+' · '+e.state;card.appendChild(title);
   const info=document.createElement('small');info.textContent='เลขสมาชิก '+(e.member_id||'-')+' | เลขคำขอ '+e.id+' | '+new Date(e.requested_at).toLocaleString('th-TH');card.appendChild(info);
   if(e.state==='Pending')for(const [decision,label,cls] of [['Approved','อนุมัติ',''],['Rejected','ปฏิเสธ','danger']]){
    const btn=document.createElement('button');btn.textContent=label;btn.className=cls;btn.onclick=()=>decide(e.id,decision);card.appendChild(btn)
   }
   $('entries').appendChild(card);
  }
 }catch(e){$('message').textContent='เปิดรายการไม่ได้: '+e.message}
}
$('reload').onclick=load;
(async()=>{try{if(!shop)throw Error('ไม่พบ shop ID');
await liff.init({liffId:APP_CONFIG.LIFF_ID_ADMIN});
if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
if(!liff.getIDToken())throw Error('LIFF ต้องเปิด scope openid');
await load()}catch(e){$('message').textContent=e.message}})();
</script></body></html>
