<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บอร์ดสด - บ่อตกกุ้ง</title>
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
    
    :root {
      --bg-dark: #0f111a;
      --card-bg: #1c1f2e;
      --card-border: #2a2d3d;
      --blue-main: #3b82f6;
      --red-main: #ef4444;
      --green-main: #10b981;
      --yellow-main: #f59e0b;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Kanit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .dashboard-container {
      width: 100%;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }
    .title-area { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 500; }
    .live-badge { background: rgba(16, 185, 129, 0.2); color: var(--green-main); padding: 4px 12px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 8px; height: 8px; background: var(--green-main); border-radius: 50%; box-shadow: 0 0 10px var(--green-main); }

    /* Header Info */
    .header-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
    }
    .round-id { font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; }
    .round-status { color: var(--text-muted); font-size: 1rem; }
    .timer-area { text-align: right; }
    .timer-label { color: var(--text-muted); font-size: 1rem; margin-bottom: 5px; }
    .timer-value { font-size: 2.5rem; font-weight: 700; color: var(--yellow-main); line-height: 1; }

    /* Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .card {
      background: #171925;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 30px;
      position: relative;
      overflow: hidden;
    }
    .card.even { border-color: rgba(59, 130, 246, 0.3); }
    .card.odd { border-color: rgba(239, 68, 68, 0.3); }
    
    .card-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; }
    .card.even .card-title { color: var(--blue-main); }
    .card.odd .card-title { color: var(--red-main); }
    
    .card-amount { font-size: 3.5rem; font-weight: 700; margin-bottom: 15px; letter-spacing: -1px; }
    .card-stats { color: var(--text-muted); font-size: 1rem; margin-bottom: 15px; }
    
    .progress-bar { width: 100%; height: 6px; background: #2a2d3d; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; }
    .card.even .progress-fill { background: var(--blue-main); width: 60%; box-shadow: 0 0 10px var(--blue-main); }
    .card.odd .progress-fill { background: var(--red-main); width: 40%; box-shadow: 0 0 10px var(--red-main); }

    /* Total & Last Result */
    .summary-card {
      background: #171925;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 25px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .summary-label { font-size: 1.2rem; color: var(--text-muted); }
    .summary-total { font-size: 2.2rem; font-weight: 700; color: var(--green-main); }

    .last-result-card {
      background: #171925;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 25px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .last-result-left { display: flex; align-items: center; gap: 20px; }
    .scale-icon { font-size: 2.5rem; color: var(--text-muted); }
    .last-result-text { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 5px; }
    .last-result-weight { font-size: 2rem; font-weight: 700; }
    .winner-badge {
      background: rgba(59, 130, 246, 0.2);
      color: var(--blue-main);
      padding: 8px 24px;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: 600;
      border: 1px solid rgba(59, 130, 246, 0.5);
    }
    .winner-badge.odd {
      background: rgba(239, 68, 68, 0.2);
      color: var(--red-main);
      border-color: rgba(239, 68, 68, 0.5);
    }
    body { padding:clamp(10px,2.4vw,32px); box-sizing:border-box; align-items:flex-start; }
    .dashboard-container { max-width:1600px; box-sizing:border-box; padding:clamp(14px,2.4vw,32px); }
    .top-bar { gap:12px; margin-bottom:22px; padding-bottom:14px; }
    .board-layout { display:grid; grid-template-columns:minmax(0,.82fr) minmax(0,1.4fr); gap:clamp(16px,2.4vw,32px); align-items:start; }
    .header-info { gap:12px; margin-bottom:18px; }
    .round-id { font-size:clamp(1.2rem,2.2vw,1.8rem); }
    .cards-grid { gap:12px; }
    .card, .summary-card, .last-result-card { padding:clamp(12px,2vw,24px); }
    .card-amount { font-size:clamp(1.6rem,3.4vw,3.5rem); overflow-wrap:anywhere; }
    .summary-total { font-size:clamp(1.3rem,2.5vw,2.2rem); }
    .last-result-weight { font-size:clamp(1.3rem,2.2vw,2rem); }
    .board-tools { display:flex; gap:12px; align-items:center; margin-top:16px; color:var(--text-muted); }
    .board-tools button { background:#252e42; border:1px solid #465472; color:white; padding:8px 12px; border-radius:8px; font:inherit; cursor:pointer; }
    .board-tables { padding:12px 0 0; color:var(--text-muted); overflow-wrap:anywhere; }
    .board-tables span { color:var(--text-main); }
    .history-panel { min-width:0; border:1px solid var(--card-border); background:#171925; border-radius:16px; overflow:hidden; }
    .history-heading { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:16px 14px 12px; }
    .history-heading h2 { margin:0; font-size:clamp(1rem,1.6vw,1.25rem); }
    .history-heading time { margin-inline-start:auto; color:#cbd5e1; font-size:.9rem; white-space:nowrap; }
    .daily-summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin:0; padding:0 12px 12px; }
    .daily-summary div { min-width:0; background:#222637; border-radius:9px; padding:7px clamp(4px,1vw,10px); text-align:center; }
    .daily-summary .summary-even { background:var(--blue-main); color:#0b1220; }
    .daily-summary .summary-odd { background:var(--red-main); color:#0b1220; }
    .daily-summary dt { color:#d2dbea; font-size:clamp(.69rem,1.1vw,.9rem); }
    .daily-summary :is(.summary-even,.summary-odd) dt { color:inherit; }
    .daily-summary dd { margin:0; font-size:clamp(.85rem,1.7vw,1.35rem); font-weight:600; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    [hidden] { display:none !important; }
    .board-gate { width:min(100%,400px); margin:28px auto; padding:22px; border:1px solid var(--card-border); border-radius:14px; background:#171925; box-sizing:border-box; }
    .board-gate h2 { margin:0 0 12px; font-size:1.25rem; }
    .board-gate label, .board-gate input { display:block; width:100%; box-sizing:border-box; }
    .board-gate input, .board-gate button { margin-top:8px; padding:10px; border:1px solid #465472; border-radius:8px; background:#252e42; color:white; font:inherit; }
    .board-gate button { cursor:pointer; background:#244981; }
    .board-gate p { min-height:1.5em; margin-bottom:0; color:#cbd5e1; }
    .history-scroll { max-height:clamp(240px,58vh,780px); overflow:auto; scrollbar-gutter:stable; }
    .history-scroll:focus-visible { outline:2px solid var(--blue-main); outline-offset:-2px; }
    .round-columns { display:grid; grid-template-columns:repeat(3,minmax(164px,1fr)); gap:1px; background:var(--card-border); align-items:start; }
    .round-table { width:100%; border-collapse:separate; border-spacing:0; background:#171925; white-space:nowrap; font-variant-numeric:tabular-nums; font-size:clamp(.75rem,1.1vw,.98rem); }
    .round-table th, .round-table td { padding:6px clamp(4px,.6vw,9px); text-align:right; border-bottom:1px solid var(--card-border); }
    .round-table th { position:sticky; top:0; background:#252b3c; z-index:1; font-weight:500; color:#e1e8f3; }
    .round-table th:first-child, .round-table td:first-child { text-align:left; }
    .round-table th:last-child, .round-table td:last-child { text-align:center; }
    .round-table tbody tr:nth-child(even) { background:#1d2030; }
    .history-message { margin:0; text-align:center; color:var(--text-muted); padding:18px 12px; }
    .history-pagination { display:flex; justify-content:center; align-items:center; gap:10px; padding:8px; border-top:1px solid var(--card-border); }
    .history-pagination[hidden] { display:none; }
    .history-pagination button { background:#252e42; border:1px solid #465472; color:white; padding:5px 10px; border-radius:8px; font:inherit; }
    .history-pagination button:disabled { opacity:.45; }
    .result-chip { display:inline-block; min-width:2.4em; text-align:center; padding:2px 7px; border-radius:6px; }
    .result-even { color:#9ac6ff; background:#24395f; }
    .result-odd { color:#ffb0b0; background:#502c3a; }
    @media(max-width:860px) { .board-layout { grid-template-columns:minmax(0,1fr); } .history-scroll { max-height:460px; } }
    @media(max-width:420px) { .last-result-left { gap:8px; } .scale-icon { display:none; } }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="title-area">
        <span id="boardShopName">บอร์ดสด</span>
      </div>
      <div class="live-badge">
        <div class="live-dot"></div> LIVE
      </div>
    </div>

    <form class="board-gate" id="boardUnlock">
      <h2>ปลดล็อกจอทีวีและ MC</h2>
      <label for="boardPassword">รหัสผ่านจอของร้าน</label>
      <input id="boardPassword" type="password" minlength="8" maxlength="128" autocomplete="current-password" required>
      <button type="submit">เปิดจอ</button>
      <p id="boardUnlockStatus" role="status"></p>
    </form>
    <div id="boardContent" hidden>
    <div class="board-layout">
      <section aria-label="รอบปัจจุบัน">
        <div class="header-info">
          <div>
            <div class="round-id" id="roundIdDisplay">รอบ —</div>
            <div class="round-status" id="statusDisplay">กำลังเชื่อมต่อข้อมูล...</div>
          </div>
          <div class="timer-area">
            <div class="timer-label">เหลือเวลา</div>
            <div class="timer-value" id="timerDisplay">--:--</div>
          </div>
        </div>

        <!-- Cards (Even / Odd) -->
        <div class="cards-grid">
          <!-- Even -->
          <div class="card even">
            <div class="card-title">คู่ · EVEN</div>
            <div class="card-amount" id="evenAmount">฿0</div>
            <div class="card-stats" id="evenCount">0 โต๊ะ</div>
            <div class="progress-bar"><div class="progress-fill" id="evenProgress" style="width: 0%;"></div></div>
          </div>
          <!-- Odd -->
          <div class="card odd">
            <div class="card-title">คี่ · ODD</div>
            <div class="card-amount" id="oddAmount">฿0</div>
            <div class="card-stats" id="oddCount">0 โต๊ะ</div>
            <div class="progress-bar"><div class="progress-fill" id="oddProgress" style="width: 0%;"></div></div>
          </div>
        </div>

        <!-- Total Summary -->
        <div class="summary-card">
          <div class="summary-label">ยอดเดิมพันรวมในบ่อ</div>
          <div class="summary-total" id="totalAmount">฿0</div>
        </div>

        <!-- Last Result -->
        <div class="last-result-card">
          <div class="last-result-left">
            <i class="fa-solid fa-scale-balanced scale-icon"></i>
            <div>
              <div class="last-result-text">ผลชั่งกุ้งรอบล่าสุด</div>
              <div class="last-result-weight" id="lastWeight">-- กรัม</div>
            </div>
          </div>
          <div class="winner-badge" id="lastWinner">-</div>
        </div>
        <div class="board-tables">โต๊ะในรอบนี้ <span id="boardTables">—</span></div>
      </section>
      <aside class="history-panel" aria-labelledby="historyHeading">
        <div class="history-heading">
          <h2 id="historyHeading">สรุปและผลแต่ละรอบ</h2>
          <time id="boardDay">—</time>
        </div>
        <dl class="daily-summary">
          <div><dt>จบรอบ</dt><dd id="dayRounds">—</dd></div>
          <div class="summary-even"><dt>ผลรวมคู่</dt><dd id="dayEven">—</dd></div>
          <div class="summary-odd"><dt>ผลรวมคี่</dt><dd id="dayOdd">—</dd></div>
        </dl>
        <p class="history-message" id="boardHistoryMessage">กำลังโหลดผลรอบ</p>
        <div class="history-scroll" id="boardHistoryScroll" tabindex="0" role="region" aria-label="ตารางผลแต่ละรอบ">
          <div class="round-columns" id="boardHistory"></div>
        </div>
        <template id="roundTableTemplate">
          <table class="round-table">
            <thead><tr><th scope="col">รอบ</th><th scope="col">กรัม</th><th scope="col">ผล</th></tr></thead>
            <tbody></tbody>
          </table>
        </template>
        <nav class="history-pagination" id="boardHistoryPages" aria-label="หน้าผลรอบ" hidden>
          <button type="button" id="previousHistoryPage">ก่อนหน้า</button>
          <span id="historyPageRange"></span>
          <button type="button" id="nextHistoryPage">ถัดไป</button>
        </nav>
      </aside>
    </div>
    <div class="board-tools">
      <button type="button" id="boardFullscreen">เต็มจอ</button>
      <span id="boardConnection" role="status">กำลังเชื่อมต่อ</span>
      <button type="button" id="boardLock">ล็อกจอ</button>
    </div>
    </div>
  </div>

  <script>
    const boardShop = new URLSearchParams(location.search).get('shop') || 'SHOP_000';
    const set = (id, text) => { document.getElementById(id).textContent = text; };
    const money = value => '฿' + Number(value).toLocaleString('th-TH');
    let currentRound;
    const roundsPerColumn = 50;
    const columnCount = 3;
    const roundsPerPage = roundsPerColumn * columnCount;
    let historyPage = 0;
    let historyDay;
    let latestHistory = [];
    let previousHistory;
    const dateFormat = new Intl.DateTimeFormat('th-TH', { dateStyle: 'medium', timeZone: 'Asia/Bangkok' });

    function renderHistory(history, emptyText = 'ยังไม่มีรอบที่จบในวันบัญชีนี้') {
      latestHistory = history;
      const lastPage = Math.max(0, Math.ceil(history.length / roundsPerPage) - 1);
      historyPage = Math.min(historyPage, lastPage);
      const start = historyPage * roundsPerPage;
      const page = history.slice(start, start + roundsPerPage);
      const key = JSON.stringify([start, page.map(({ round_id, weight, result }) => [round_id, weight, result]), emptyText]);
      const message = document.getElementById('boardHistoryMessage');
      const scroll = document.getElementById('boardHistoryScroll');
      message.hidden = history.length > 0;
      message.textContent = emptyText;
      scroll.hidden = !history.length;
      document.getElementById('boardHistoryPages').hidden = lastPage === 0;
      document.getElementById('previousHistoryPage').disabled = historyPage === 0;
      document.getElementById('nextHistoryPage').disabled = historyPage === lastPage;
      set('historyPageRange', history.length ? (start + 1) + '–' + (start + page.length) + ' / ' + history.length : '');
      if (key === previousHistory) return;
      previousHistory = key;

      const columns = document.createDocumentFragment();
      const template = document.getElementById('roundTableTemplate');
      for (let index = 0; index < columnCount && page.length; index++) {
        const offset = index * roundsPerColumn;
        const table = template.content.firstElementChild.cloneNode(true);
        table.setAttribute('aria-label', 'ผลรอบลำดับ ' + (start + offset + 1) + ' ถึง ' + (start + offset + roundsPerColumn));
        for (const round of page.slice(offset, offset + roundsPerColumn)) {
          const row = table.tBodies[0].insertRow();
          row.insertCell().textContent = round.round_id;
          row.insertCell().textContent = round.weight ?? '—';
          const result = document.createElement('span');
          result.className = 'result-chip ' + (round.result === 'คู่' ? 'result-even' : round.result === 'คี่' ? 'result-odd' : '');
          result.textContent = round.result || '—';
          row.insertCell().append(result);
        }
        columns.append(table);
      }
      document.getElementById('boardHistory').replaceChildren(columns);
    }

    for (const [id, step] of [['previousHistoryPage', -1], ['nextHistoryPage', 1]]) {
      document.getElementById(id).addEventListener('click', () => {
        historyPage += step;
        document.getElementById('boardHistoryScroll').scrollTop = 0;
        renderHistory(latestHistory);
      });
    }

    function updateBoardTimer() {
      const remaining = currentRound?.status === 'Open'
        ? Math.max(0, Math.ceil((Number(currentRound.end_time_ms) - Date.now()) / 1000)) : 0;
      set('timerDisplay', [Math.floor(remaining / 60), remaining % 60].map(n => String(n).padStart(2, '0')).join(':'));
      set('statusDisplay', !currentRound ? 'ยังไม่มีรอบ' : currentRound.status === 'Ended' ? 'จบรอบแล้ว'
        : remaining > 0 ? 'เปิดรับยอด' : 'ปิดรับยอด · รอผล');
    }

    const unlockForm = document.getElementById('boardUnlock');
    const boardContent = document.getElementById('boardContent');
    const sessionKey = 'mc-board-session:' + boardShop;
    let boardSession;
    let boardRefreshTimer;
    try { boardSession = sessionStorage.getItem(sessionKey); } catch {}

    function saveSession(session) {
      boardSession = session;
      try {
        if (session) sessionStorage.setItem(sessionKey, session);
        else sessionStorage.removeItem(sessionKey);
      } catch {}
    }

    function lockBoard(message = '') {
      clearTimeout(boardRefreshTimer);
      saveSession(null);
      currentRound = null;
      boardContent.hidden = true;
      unlockForm.hidden = false;
      set('boardShopName', 'จอทีวีและ MC');
      set('boardUnlockStatus', message);
    }

    async function requestBoard(action, fields) {
      const response = await fetch(APP_CONFIG.SUPABASE_URL + '/functions/v1/mc-board', {
        method: 'POST', cache: 'no-store', signal: AbortSignal.timeout(9000),
        headers: { 'Content-Type': 'application/json', apikey: APP_CONFIG.SUPABASE_ANON_KEY },
        body: JSON.stringify({ action, shop_id: boardShop, ...fields }),
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.code || 'BOARD_UNAVAILABLE');
      return data;
    }

    unlockForm.addEventListener('submit', async event => {
      event.preventDefault();
      const button = unlockForm.querySelector('button');
      const input = document.getElementById('boardPassword');
      button.disabled = true;
      set('boardUnlockStatus', 'กำลังตรวจรหัสผ่าน…');
      try {
        const { session } = await requestBoard('unlock', { password: input.value });
        saveSession(session);
        await refreshBoard();
      } catch (error) {
        set('boardUnlockStatus', ({
          BOARD_PASSWORD_INVALID: 'กรอกรหัสผ่าน 8–128 ตัวอักษร',
          BOARD_PASSWORD_INCORRECT: 'รหัสผ่านไม่ถูกต้อง',
          BOARD_SETUP_REQUIRED: 'ร้านยังไม่ได้ตั้งรหัสผ่านหรือยังไม่เปิดบริการ',
          BOARD_TRY_LATER: 'ลองหลายครั้งแล้ว กรุณารอ 1 นาที',
        })[error.message] || 'เชื่อมต่อไม่ได้ กรุณาลองใหม่');
      } finally {
        input.value = '';
        button.disabled = false;
      }
    });

    document.getElementById('boardLock').onclick = () => lockBoard();

    async function refreshBoard() {
      const session = boardSession;
      if (!session) return;
      try {
        const { board } = await requestBoard('read', { board_session: session });
        if (session !== boardSession) return;
        unlockForm.hidden = true;
        boardContent.hidden = false;
        set('boardShopName', board.shop_name);
        currentRound = board.round;
        set('roundIdDisplay', board.round ? 'รอบ ' + board.round.round_id : 'รอบ —');
        updateBoardTimer();
        const totals = board.totals;
        const total = Number(totals.even) + Number(totals.odd);
        for (const side of ['even', 'odd']) {
          set(side + 'Amount', money(totals[side]));
          set(side + 'Count', totals[side + '_count'] + ' โต๊ะ/บิล');
          document.getElementById(side + 'Progress').style.width = (total ? Number(totals[side]) / total * 100 : 0) + '%';
        }
        set('totalAmount', money(total));
        set('lastWeight', board.last_result ? board.last_result.weight + ' กรัม' : '—');
        set('lastWinner', board.last_result?.result || '—');
        document.getElementById('lastWinner').classList.toggle('odd', board.last_result?.result === 'คี่');
        set('boardTables', totals.tables.length ? totals.tables.sort((a, b) => a.localeCompare(b, 'th', { numeric: true })).join(' · ') : '—');
        if (board.accounting_day) {
          document.getElementById('boardDay').dateTime = board.accounting_day;
          set('boardDay', dateFormat.format(new Date(board.accounting_day + 'T06:00:00+07:00')));
        }
        set('dayRounds', board.daily.rounds ?? Number(board.daily.even) + Number(board.daily.odd));
        set('dayEven', board.daily.even);
        set('dayOdd', board.daily.odd);
        if (historyDay !== board.accounting_day) {
          historyDay = board.accounting_day;
          historyPage = 0;
          document.getElementById('boardHistoryScroll').scrollTop = 0;
        }
        renderHistory(board.history ?? []);
        set('boardConnection', 'อัปเดต ' + new Date().toLocaleTimeString('th-TH', { timeZone: 'Asia/Bangkok' }));
      } catch (error) {
        if (session !== boardSession) return;
        if (error.message === 'BOARD_PASSWORD_REQUIRED') {
          lockBoard('กรุณากรอกรหัสผ่านเพื่อเปิดจออีกครั้ง');
        } else {
          set('boardUnlockStatus', 'เชื่อมต่อไม่ได้ กำลังลองใหม่');
          set('boardConnection', 'ข้อมูลอาจไม่ล่าสุด · กำลังเชื่อมต่อใหม่');
        }
      } finally {
        if (session === boardSession) boardRefreshTimer = setTimeout(refreshBoard, 3000);
      }
    }

    const fullscreen = document.getElementById('boardFullscreen');
    fullscreen.hidden = !document.fullscreenEnabled;
    fullscreen.onclick = async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch { set('boardConnection', 'เปิดเต็มจอจากเมนูเบราว์เซอร์ได้'); }
    };
    document.addEventListener('fullscreenchange', () => {
      fullscreen.textContent = document.fullscreenElement ? 'ออกจากเต็มจอ' : 'เต็มจอ';
    });
    setInterval(updateBoardTimer, 1000);
    refreshBoard();
  </script>
</body>
</html>
