<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ระบบผู้แนะนำ (Promoter)</title>
  <script src="config.js?v=player-entry-1"></script>
  <script src="admin-api-client.js?v=shop-rbac-1"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Kanit', sans-serif; background-color: #12141e; color: #ffffff; margin: 0; padding: 20px; }
    .container { max-width: 480px; margin: 0 auto; }
    .card { background: #1c1e2b; border: 1px solid #2a2d3d; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .btn { width: 100%; border: none; padding: 12px; border-radius: 8px; font-family: 'Kanit'; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    .text-pink { color: #ec4899; }
    .bg-pink { background: #ec4899; }
    .wallet-box { background: #0f111a; border: 1px solid #ec4899; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="container">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #2a2d3d; padding-bottom: 15px;">
      <div style="font-size: 1.3rem; font-weight: bold;" class="text-pink">
          <i class="fa-solid fa-share-nodes"></i> ระบบแนะนำเพื่อน
      </div>
      <button data-back-player onclick="window.location.href='index.html?shop=' + encodeURIComponent(currentShopId)" style="background: transparent; color: #94a3b8; border: 1px solid #94a3b8; border-radius: 6px; padding: 5px 10px; cursor: pointer;">
          กลับหน้าหลัก
      </button>
    </div>

    <p id="referralStatus" role="status">กำลังตรวจสอบสิทธิ์…</p>
    <div class="card referral-content" hidden>
      <div class="wallet-box">
        <div style="color: #94a3b8; font-size: 0.9rem;">ยอดค่าคอมมิชชั่นสะสม</div>
        <div id="commBalance" style="font-size: 2.5rem; font-weight: bold; color: #10b981; margin-top: 5px;">฿0.00</div>
        <div style="font-size: 0.8rem; color: #ec4899; margin-top: 8px;">ผู้แนะนำ: <span id="promoterName">กำลังโหลด...</span></div>
      </div>
      <button class="btn bg-pink" onclick="requestWithdraw()"><i class="fa-solid fa-money-bill-transfer"></i> แจ้งถอนค่าคอมมิชชั่น</button>
    </div>

    <div class="card referral-content" hidden>
      <h3 style="margin-top: 0; border-bottom: 1px dashed #2a2d3d; padding-bottom: 10px;" class="text-pink">
          <i class="fa-solid fa-link"></i> ลิงก์ชวนเพื่อนของคุณ
      </h3>
      <p style="font-size: 0.9rem; color: #94a3b8;">ให้เพื่อนของคุณสแกน QR Code หรือกดลิงก์ด้านล่างเพื่อเข้าเล่น คุณจะได้รับส่วนแบ่งเมื่อเพื่อนมีการแทงกุ้ง</p>
      
      <div style="background: white; padding: 15px; border-radius: 12px; display: inline-block; margin: 10px auto; text-align: center; width: 100%; box-sizing: border-box;">
          <div id="referralQr" role="img" aria-label="QR แนะนำลูกค้า" style="display:flex;justify-content:center"></div>
      </div>
      
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <input type="text" aria-label="ลิงก์แนะนำ" id="refLinkInput" readonly style="flex: 2; padding: 10px; border-radius: 8px; background: #0f111a; border: 1px solid #2a2d3d; color: white;">
        <button class="btn" style="flex: 1; background: #3b82f6;" onclick="copyLink()"><i class="fa-regular fa-copy"></i> คัดลอก</button>
      </div>
      <p>รหัสแนะนำ <strong id="referralCode"></strong></p>
      <button id="shareReferral" class="btn bg-pink" type="button">แชร์ลิงก์ LINE</button>
      <button id="shareReferralFlex" class="btn bg-pink" type="button">แชร์ Flex ใน LINE</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const restored = new URL(params.get('liff.state') || '/', location.origin);
    const currentShopId = params.get('shop') ||
      (restored.origin === location.origin && restored.searchParams.get('shop')) || 'SHOP_000';
    const api = createAdminApiClient(APP_CONFIG, () => currentShopId);
    const referralStatus = document.getElementById('referralStatus');
    const referralLink = document.getElementById('refLinkInput');
    let currentUser;
    let commissionRetry;
    let commissionBusy = false;

    async function initPromoter() {
      try {
        await liff.init({ liffId: APP_CONFIG.LIFF_ID_PLAYER });
        if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
        ({ profile: currentUser } = await api.referralProfile());
        const code = formatMemberCode(currentShopId,currentUser.member_id);
        referralLink.value = playerEntryUrl(currentShopId, { ref: code });
        document.getElementById('referralCode').textContent = code;
        document.getElementById('promoterName').textContent = currentUser.display_name;
        document.getElementById('commBalance').textContent = '฿' + Number(currentUser.commission_balance || 0).toLocaleString('th-TH');
        if (currentUser.role === 'Cashier') {
          const back = document.querySelector('[data-back-player]');
          back.textContent = 'กลับหน้าแคชเชียร์';
          back.onclick = () => { location.href = 'admin.html?shop=' + encodeURIComponent(currentShopId); };
        }
        document.getElementById('shareReferralFlex').hidden = !liff.isApiAvailable('shareTargetPicker');
        document.querySelectorAll('.referral-content').forEach(card => { card.hidden = false; });
        referralStatus.textContent = '';
        if (typeof QRCode === 'function') new QRCode(document.getElementById('referralQr'), { text: referralLink.value, width: 200, height: 200 });
        else document.getElementById('referralQr').textContent = 'โหลด QR ไม่สำเร็จ';
      } catch (error) {
        referralStatus.textContent = error.message === 'ACCESS_DENIED'
          ? 'คุณไม่มีสิทธิ์เข้าถึงหน้านี้ กรุณาติดต่อเจ้าของร้าน' : 'เปิดหน้าแนะนำลูกค้าไม่สำเร็จ กรุณาเปิดใหม่';
      }
    }

    async function copyLink() {
      if (!referralLink.value) return;
      try {
        await navigator.clipboard.writeText(referralLink.value);
        referralStatus.textContent = 'คัดลอกลิงก์แล้ว';
      } catch {
        referralLink.select();
        referralStatus.textContent = 'เลือกลิงก์แล้ว กดคัดลอกบนอุปกรณ์';
      }
    }

    document.getElementById('shareReferral').onclick = () => {
      if (!referralLink.value) return;
      liff.openWindow({ url: 'https://line.me/R/msg/text/?' + encodeURIComponent(referralLink.value), external: true });
    };
    document.getElementById('shareReferralFlex').onclick = async () => {
      if (!referralLink.value || !liff.isApiAvailable('shareTargetPicker')) return;
      try {
        const sent = await liff.shareTargetPicker([{ type: 'flex', altText: 'ชวนเข้าใช้งานบ่อตกกุ้ง', contents: {
          type: 'bubble', body: { type: 'box', layout: 'vertical', contents: [
            { type: 'text', text: 'ชวนเข้าใช้งานบ่อตกกุ้ง', weight: 'bold', wrap: true },
          ] }, footer: { type: 'box', layout: 'vertical', contents: [
            { type: 'button', style: 'primary', action: { type: 'uri', label: 'เปิดลิงก์แนะนำ', uri: referralLink.value } },
          ] },
        } }]);
        if (sent) referralStatus.textContent = 'แชร์คำเชิญแล้ว';
      } catch { referralStatus.textContent = 'แชร์ Flex ไม่สำเร็จ'; }
    };

    async function requestWithdraw() {
      if (!currentUser || commissionBusy) return;
      const amount = prompt('ระบุจำนวนค่าคอมมิชชั่นที่ต้องการถอน (บาท)')?.trim();
      if (!amount || !/^\d{1,9}(?:\.\d{1,2})?$/.test(amount) || Number(amount) <= 0) return;
      const mode = prompt('พิมพ์ 1 เพื่อรับเงินโอน หรือ 2 เพื่อเติมเครดิต');
      if (mode !== '1' && mode !== '2') return;
      const type = mode === '1' ? 'cash' : 'credit';
      const key = type + ':' + amount;
      if (commissionRetry?.key !== key) commissionRetry = { key, id: crypto.randomUUID() };
      commissionBusy = true;
      try {
        await api.commissionRequest(commissionRetry.id, type, amount);
        commissionRetry = null;
        alert('ส่งคำขอให้แอดมินแล้ว');
        location.reload();
      } catch (error) {
        referralStatus.textContent = 'ส่งคำขอไม่สำเร็จ: ' + error.message;
      } finally { commissionBusy = false; }
    }

    initPromoter();
  </script>
</body>
</html>
